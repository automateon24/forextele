
# NIFTY Options Trading System Configuration
system:
  name: "NIFTY Options Trading System"
  version: "2.0.0"
  environment: "development"
  
api:
  dhan:
    client_id: ${DHAN_CLIENT_ID}
    access_token: ${DHAN_ACCESS_TOKEN}
    base_url: "https://api.dhan.co"
    timeout: 30
    retry_attempts: 3
  
trading:
  broker_charges: 40.0
  capital_per_strategy: 100000
  max_position_size: 100
  risk_percentage: 2.0
  
strategies:
  enabled:
    - enhanced_day_high_low
    - rsi_oversold
    - rsi_overbought
    - mean_reversion
    - breakout_scalping
    - trend_following
    - volatility_scalping
    - ai_enhanced
  
  parameters:
    enhanced_day_high_low:
      lookback_period: 20
      entry_threshold: 0.02
      exit_threshold: 0.03
    
    rsi_oversold:
      rsi_period: 14
      oversold_level: 30
      overbought_level: 70
    
    rsi_overbought:
      rsi_period: 14
      oversold_level: 30
      overbought_level: 70
    
    mean_reversion:
      lookback_period: 20
      entry_threshold: 2.0
      exit_threshold: 1.0
    
    breakout_scalping:
      breakout_period: 10
      volume_threshold: 1.5
      profit_target: 0.01
    
    trend_following:
      trend_period: 50
      signal_threshold: 0.02
      stop_loss: 0.03
    
    volatility_scalping:
      volatility_period: 20
      volatility_threshold: 0.02
      profit_target: 0.015
    
    ai_enhanced:
      model_type: "ensemble"
      confidence_threshold: 0.7
      max_positions: 5

database:
  type: "sqlite"
  path: "data/trading_system.db"
  
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/trading_system.log"
  max_size: "10MB"
  backup_count: 5
  
monitoring:
  dashboard_port: 5000
  update_interval: 2
  enable_terminal: true
  enable_api: true
