# Historical Data Availability
data_availability:
  # Dhan API provides up to 5 years of historical options data with Greeks
  # IMPORTANT: Greeks (Delta, Gamma, Theta, Vega) available only for last 5 years
  # For periods beyond 5 years, use EOD data without Greeks
  dhan_api:
    max_years: 5
    includes_greeks: true
    includes_oi: true
    includes_iv: true
    start_date: null  # Will be calculated as today - 5 years
    note: "Greeks data available only for last 5 years via /charts/rollingoption endpoint"
  
  # NSE EOD data available for longer periods (10+ years)
  # Use this for historical analysis beyond 5 years (without Greeks)
  nse_eod:
    max_years: 10
    includes_greeks: false
    includes_oi: false
    includes_iv: false
    note: "EOD data without Greeks - use for long-term historical analysis"

# Notes
notes: |
  CRITICAL FOR BACKTESTING ACCURACY:
  
  1. LOT SIZES:
     - Lot sizes directly affect P&L calculations
     - Must use correct lot size for each historical period
     - Example: 1 point move in NIFTY = ₹25 before Oct 2024, ₹75 from Oct 2024-Oct 2025, ₹65 after Oct 2025
     - Wrong lot size = incorrect profit/loss = inaccurate backtesting results
  
  2. EXPIRY DAYS:
     - Expiry day changes affect option pricing and time decay calculations
     - Thursday expiry (traditional) vs Tuesday expiry (2025+) affects weekly patterns
     - Must match expiry day to historical period for accurate backtesting
  
  3. WEEKLY EXPIRY:
     - Weekly expiry introduced June 7, 2019
     - Before this date, only monthly expiry was available
     - Affects liquidity, pricing patterns, and strategy selection
  
  4. GREEKS AVAILABILITY:
     - Greeks (Delta, Gamma, Theta, Vega) available only for last 5 years via Dhan API
     - For periods beyond 5 years, use EOD data without Greeks
     - Module 2 should handle both scenarios (with/without Greeks)
  
  5. DATA INTEGRATION:
     - Contract specs must be added to all historical dataframes
     - Module 2 output should include contract specs for backtesting
     - ML models should use contract specs as features
  
  6. BACKTESTING REQUIREMENTS:
     - All backtesting must use correct lot size for each trade date
     - Expiry day must match historical period
     - Weekly expiry availability must be checked before strategy selection
     - P&L calculations must account for lot size changes

