# Historical Contract Specifications for NIFTY Options
# This file tracks lot sizes and expiry dates over time for accurate backtesting
# Version: 2.0 - Updated with accurate historical data from NSE circulars
# Last Updated: 2025-12-24
# 
# CRITICAL FOR BACKTESTING: Lot sizes and expiry days affect P&L calculations
# All historical data must use correct contract specs for accurate backtesting

# NIFTY 50 Options
nifty:
  lot_size_changes:
    # Format: start_date: lot_size
    # Historical lot size changes (effective dates from NSE circulars)
    "2000-01-01": 25   # Original lot size (from inception ~2000)
    "2024-10-28": 75   # Increased per SEBI mandate (min contract size ₹15 lakh)
                       # Effective for new contracts from Nov 20, 2024
    "2025-10-28": 65   # Reduced from 75 to 65 (effective Oct 28, 2025)
                       # Existing contracts maintained lot size until expiry
  
  expiry_day_changes:
    # Format: start_date: expiry_day
    # Historical expiry day changes
    "2000-01-01": "THURSDAY"  # Traditional expiry day (last Thursday of month)
    "2025-04-04": "MONDAY"     # Changed to Monday (effective April 4, 2025)
                               # SEBI mandate to limit expiries to Tuesday/Thursday
                               # NSE chose Monday for NIFTY (some sources say Tuesday)
    "2025-09-01": "TUESDAY"    # Changed to Tuesday (effective Sept 1, 2025)
                               # SEBI standardization to Tuesday/Thursday only
  
  weekly_expiry_introduction:
    # Weekly expiry introduction dates
    "2019-06-07": true  # Weekly expiry introduced for NIFTY (June 7, 2019)
                        # Before this, only monthly expiry was available
  
  monthly_expiry:
    # Monthly expiry has always been available
    always_active: true
    # Monthly expiry day follows expiry_day_changes above

# BANKNIFTY Options
banknifty:
  lot_size_changes:
    # Historical lot size changes
    "2000-01-01": 15   # Original lot size
    "2024-10-28": 30   # Increased per SEBI mandate (min contract size ₹15 lakh)
    "2025-03-01": 35   # Further increased (effective March 1, 2025)
    "2025-10-28": 30   # Reduced from 35 to 30 (effective Oct 28, 2025)
  
  expiry_day_changes:
    "2000-01-01": "THURSDAY"  # Traditional expiry day
    "2025-04-04": "MONDAY"    # Changed to Monday (effective April 4, 2025)
    "2025-09-01": "TUESDAY"   # Changed to Tuesday (effective Sept 1, 2025)
  
  weekly_expiry_introduction:
    "2019-06-07": true  # Weekly expiry introduced
  
  monthly_expiry:
    always_active: true

